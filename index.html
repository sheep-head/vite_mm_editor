<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>羊头呀</title>
  <script>
    /*
     * NW.js 兼容处理：
     * vite 打包出来的是 ES module，模块内部没有 require，
     * 所以在这里把 node 的 require 挂到 window.nwRequire 上，
     * 项目内部所有 require('xxx') 统一写成 window.nwRequire('xxx') / nwRequire('xxx')。
     * 非 NW.js 环境（例如直接在浏览器里跑 vite dev）require 不存在，这里兜底为 null。
     */
    try {
      window.nwRequire = require;
    } catch (e) {
      window.nwRequire = null;
    }

    /*
     * NW.js mixed-context：Node 全局的 CustomEvent/Event 不是 DOM Event，
     * Element Plus 关闭弹窗时 focus-trap 的 dispatchEvent 会抛错导致弹窗关不掉。
     * 用隐藏 iframe 取回 Chromium 的构造函数并覆盖全局。
     */
    if (window.nwRequire) {
      var _iframe = document.createElement('iframe');
      _iframe.style.display = 'none';
      document.documentElement.appendChild(_iframe);
      if (_iframe.contentWindow) {
        window.Event = _iframe.contentWindow.Event;
        window.CustomEvent = _iframe.contentWindow.CustomEvent;
      }
      document.documentElement.removeChild(_iframe);
    }

    location.hash = "";

    /* NW.js 窗口初始化，非 NW.js 环境自动跳过 */
    if (window.nwRequire) {
      var win = window.nwRequire('nw.gui').Window.get();
      var VITE_DEV_PORT = 5288;

      function killViteDevServer(port) {
        try {
          var execSync = window.nwRequire('child_process').execSync;
          var out = '';
          try {
            out = execSync('netstat -ano', { encoding: 'utf8' });
          } catch (e) {
            out = '';
          }
          var pids = {};
          var needle = ':' + port;
          String(out).split(/\r?\n/).forEach(function (line) {
            if (line.indexOf(needle) < 0) return;
            if (!/\bLISTENING\b/i.test(line)) return;
            var parts = line.trim().split(/\s+/);
            var pid = parts[parts.length - 1];
            if (/^\d+$/.test(pid) && pid !== '0') pids[pid] = true;
          });
          Object.keys(pids).forEach(function (pid) {
            try {
              execSync('taskkill /PID ' + pid + ' /T /F', { stdio: 'ignore' });
            } catch (e) {}
          });
          // 顺带清掉 start-nw.bat 起的最小化 vite 控制台（若还在）
          try {
            execSync('taskkill /FI "WINDOWTITLE eq vite-mm-editor-vite*" /T /F', { stdio: 'ignore' });
          } catch (e) {}
        } catch (e) {
          console.warn('kill vite failed', e);
        }
      }

      win.on('close', function () {
        var ok = window.confirm(
          '是否完全退出编辑器？\n\n选「是」：先关闭 Vite（端口 ' +
            VITE_DEV_PORT +
            '），再退出本窗口。\n选「否」：取消关闭。'
        );
        if (!ok) return;
        killViteDevServer(VITE_DEV_PORT);
        this.close(true);
      });

      win.maximize();
      win.showDevTools();
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
